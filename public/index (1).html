<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>मुर्गा मंडी भाव</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16201A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#F1F5F2;--surf:#fff;--ink:#16201A;--mut:#5E6B63;--line:#D5DDD7;--acc:#D98A0B;--up:#1E8A4C;--dn:#C23B22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--surf:#18221B;--ink:#EAF1EC;--mut:#9AA89F;--line:#2A372E;--acc:#F0A83A;--up:#4CC380;--dn:#F07B63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101712;--surf:#18221B;--ink:#EAF1EC;--mut:#9AA89F;--line:#2A372E;--acc:#F0A83A;--up:#4CC380;--dn:#F07B63;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:4px 0 0}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.demo{background:var(--surf);border-left:4px solid var(--acc);padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-weight:600;border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;gap:8px;margin-bottom:12px}
input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);min-width:0}
.bar input{flex:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,52px);gap:4px;align-items:center;padding:12px 14px;background:var(--surf);border-bottom:1px solid var(--line)}
button.row{width:100%;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.arow{display:flex;justify-content:space-between;gap:8px}
.city{font-weight:600;font-size:16px}
.st{font-size:13px;color:var(--mut)}
.n{text-align:right;font-size:15px;color:var(--mut)}
.n.t{font-weight:800;font-size:17px;color:var(--ink)}
.n.t.up{color:var(--up)}.n.t.dn{color:var(--dn)}
.ar{font-size:9px;margin-right:2px;vertical-align:middle}
.ch{background:none;border:0;padding:6px 14px 4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg)}
.ch .n{font-size:12px;font-weight:600;color:var(--mut)}
.hd{background:var(--ink);color:var(--bg);border-radius:10px 10px 0 0}
.hd .st{color:var(--bg);opacity:.75}
.hd .n,.hd .n.t,.hd .n.t.up,.hd .n.t.dn{color:var(--bg)}
.back{border:0;background:none;color:var(--ink);font:inherit;font-weight:800;padding:6px 0 12px;cursor:pointer}
.gh{font-weight:800;margin:18px 0 2px;font-size:17px}
.adm input{width:90px;text-align:right}
.save{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#16201A;font:inherit;font-weight:800}
.msg{margin-top:10px;font-weight:600;color:var(--up)}
.empty{padding:20px;text-align:center;color:var(--mut);background:var(--surf)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>मुर्गा मंडी भाव</h1>
<p class="sub" id="sub">लाइव ब्रॉयलर, ₹ प्रति किलो · पिछले 3 दिन</p>
<div class="demo">ये demo data है। असली भाव scraper या admin से आएंगे।</div>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">भाव देखें</button>
<button role="tab" id="t2" aria-selected="false">Admin</button>
</div>
<section id="v1">
<div class="bar"><input id="q" type="search" placeholder="राज्य या शहर खोजें" aria-label="राज्य या शहर खोजें"></div>
<button class="back" id="back" hidden>← सभी राज्य</button>
<div id="list"></div>
</section>
<section id="v2" hidden>
<div class="adm" id="adm"></div>
<button class="save" id="save">भाव सेव करें</button>
<div class="msg" id="msg" role="status"></div>
</section>
</main>
<script>
var baseDate=new Date(),KEY='murga-rates-v2',PKEY='murga-parts-v5',cur=null;
var base=[["दिल्ली","दिल्ली",112,110],["मुंबई","महाराष्ट्र",118,118],["पुणे","महाराष्ट्र",115,116],["हैदराबाद","तेलंगाना",104,101],["बेंगलुरु","कर्नाटक",107,109],["चेन्नई","तमिलनाडु",109,109],["कोलकाता","पश्चिम बंगाल",121,119],["लखनऊ","उत्तर प्रदेश",110,111],["पटना","बिहार",116,114],["जयपुर","राजस्थान",108,108],["अहमदाबाद","गुजरात",113,115],["भोपाल","मध्य प्रदेश",106,104],["भुवनेश्वर","ओडिशा",111,111],["लुधियाना","पंजाब",109,107],["अमृतसर","पंजाब",111,111],["जालंधर","पंजाब",108,109],["पटियाला","पंजाब",110,108]].map(function(r,i){return{city:r[0],state:r[1],today:r[2],yest:r[3],prev:r[3]+((r[2]+i)%5)-2}});
var data=base;
try{var s=localStorage.getItem(KEY);if(s){var p0=JSON.parse(s);if(Array.isArray(p0)&&p0.length){data=p0;base.forEach(function(b){if(!data.some(function(r){return r.city===b.city}))data.push(b)})}}}catch(e){}
var L='लाइव मुर्गा (वज़न अनुसार)',P='पार्ट और प्रोसेस्ड',V='आवक (गाड़ियों की गिनती)';
var parts=[[L,'2200–2600 ग्राम',112,112],[L,'2000–2200 ग्राम',112,112],[L,'1600–1800 ग्राम',108,109],[L,'1400–1500 ग्राम',106,106],[L,'1300–1400 ग्राम',106,105],[L,'तंदूरी 1200–1300 ग्राम',108,106],[P,'पेरेंट',95,95],[P,'थाई (जांघ)',250,245],[P,'चेस्ट',250,245],[P,'टांगड़ी नं. 12',200,195],[P,'टांगड़ी नं. 10',180,175],[P,'टांगड़ी नं. 8',160,155],[P,'विंग',180,178],[P,'लॉलीपॉप',270,265],[P,'ड्रेस्ड चिकन',200,195],[V,'वेहिकल (आई गाड़ियाँ)',100,95]].map(function(r,i){return{g:r[0],n:r[1],t:r[2],y:r[3],p:r[3]+((r[2]+i)%5)-2}});
try{var ps=localStorage.getItem(PKEY);if(ps){var pp=JSON.parse(ps);if(Array.isArray(pp)&&pp.length===parts.length)parts=pp}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(PKEY,JSON.stringify(parts))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function dts(){var o=[];for(var i=0;i<3;i++){var d=new Date(baseDate.getTime());d.setDate(d.getDate()-i);o.push(('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2))}return o}
function cells(t,y,p){var d=t-y,c=d>0?'up':d<0?'dn':'',a=d>0?'▲':d<0?'▼':'';return'<div class="n t '+c+'"><span class="ar">'+a+'</span>'+t+'</div><div class="n">'+y+'</div><div class="n">'+p+'</div>'}
function colHead(){return'<div class="row ch"><div></div>'+dts().map(function(x){return'<div class="n">'+x+'</div>'}).join('')+'</div>'}
function avg(a,k){return Math.round(a.reduce(function(s,r){return s+(r[k]!=null?r[k]:r.yest)},0)/a.length)}
function partsHtml(){var g='',h='';parts.forEach(function(p){if(p.g!==g){g=p.g;h+='<div class="gh">'+g+'</div>'+colHead()}h+='<div class="row"><div class="city">'+p.n+'</div>'+cells(p.t,p.y,p.p!=null?p.p:p.y)+'</div>'});return '<div class="gh">दिल्ली मंडी भाव</div>'+h}
function render(){
var q=$('q').value.trim(),h=colHead();$('back').hidden=!cur;
if(cur){
var a=data.filter(function(r){return r.state===cur});
h+='<div class="row hd"><div><div class="city">'+cur+'</div><div class="st">औसत · '+a.length+' शहर</div></div>'+cells(avg(a,'today'),avg(a,'yest'),avg(a,'prev'))+'</div>';
var rows=a.filter(function(r){return!q||r.city.indexOf(q)>-1});
h+=rows.length?rows.map(function(r){return'<div class="row"><div class="city">'+r.city+'</div>'+cells(r.today,r.yest,r.prev!=null?r.prev:r.yest)+'</div>'}).join(''):'<div class="empty">कोई शहर नहीं मिला। दूसरा नाम खोजें।</div>';
if(cur==='दिल्ली'&&!q)h+=partsHtml();
$('list').innerHTML=h;return}
var st=[];data.forEach(function(r){if(st.indexOf(r.state)<0)st.push(r.state)});
var hs=st.filter(function(x){return!q||x.indexOf(q)>-1||data.some(function(r){return r.state===x&&r.city.indexOf(q)>-1})}).map(function(x){var a=data.filter(function(r){return r.state===x});return'<button class="row" data-st="'+x+'"><div><div class="city">'+x+'</div><div class="st">'+a.length+' शहर ›</div></div>'+cells(avg(a,'today'),avg(a,'yest'),avg(a,'prev'))+'</button>'}).join('');
$('list').innerHTML=hs?h+hs:'<div class="empty">कोई राज्य नहीं मिला। दूसरा नाम खोजें।</div>'}
$('list').onclick=function(e){var b=e.target.closest('[data-st]');if(b){cur=b.dataset.st;$('q').value='';render();window.scrollTo(0,0)}};
$('back').onclick=function(){cur=null;$('q').value='';render()};
function renderAdm(){$('adm').innerHTML=data.map(function(r,i){return'<div class="row arow"><div><div class="city">'+r.city+'</div><div class="st">कल: ₹'+r.yest+'</div></div><input type="number" inputmode="numeric" min="0" data-i="'+i+'" value="'+r.today+'" aria-label="'+r.city+' भाव"></div>'}).join('')+'<div class="gh">दिल्ली मंडी: वज़न, पार्ट और आवक</div>'+parts.map(function(p,i){return'<div class="row arow"><div><div class="city">'+p.n+'</div><div class="st">'+p.g+' · कल: '+p.y+'</div></div><input type="number" inputmode="numeric" min="0" data-p="'+i+'" value="'+p.t+'" aria-label="'+p.n+' भाव"></div>'}).join('')}
function tab(n){$('v1').hidden=n!==1;$('v2').hidden=n!==2;$('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);if(n===2){renderAdm();$('msg').textContent=''}}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
$('q').oninput=render;
$('save').onclick=function(){
var n=0;
document.querySelectorAll('#adm input[data-i]').forEach(function(el){var r=data[+el.dataset.i],v=parseInt(el.value,10);if(v>0&&v!==r.today){r.prev=r.yest;r.yest=r.today;r.today=v;n++}});
document.querySelectorAll('#adm input[data-p]').forEach(function(el){var p=parts[+el.dataset.p],v=parseInt(el.value,10);if(v>0&&v!==p.t){p.p=p.y;p.y=p.t;p.t=v;n++}});
save();render();renderAdm();$('msg').textContent=n?n+' भाव सेव हुए।':'कोई बदलाव नहीं मिला।'};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
fetch('rates.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
if(!j.cities||!j.cities.length)return;
data=j.cities;if(j.parts&&j.parts.length)parts=j.parts;
if(j.date){baseDate=new Date(j.date+'T00:00:00');$('sub').textContent='लाइव ब्रॉयलर, ₹ प्रति किलो · अपडेट '+j.date.split('-').reverse().join('/')}
var dm=document.querySelector('.demo');if(dm&&!j.demo)dm.hidden=true;if(!j.demo)document.querySelector('.tabs').hidden=true;
render()}).catch(function(){});
</script>
</body>
</html>
