name: Daily rates
on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py
      - name: Save rates
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || (git commit -m "rates $(date -u +%F)" && git push)
